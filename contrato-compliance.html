<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acuerdo Marco de Cumplimiento Normativo y Gobernanza</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060A12;
            --bg-card: #0B1221;
            --bg-clause: #101A2E;
            --gold-pure: #D4AF37;
            --gold-bright: #F7D969;
            --gold-dark: #997A15;
            --text-ivory: #F4F1EA;
            --text-muted: #A3B1C6;
            --border-gold: rgba(212, 175, 55, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top center, #0E1930 0%, var(--bg-deep) 75%);
            color: var(--text-ivory);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.75;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Barra de progreso superior en Oro Puro */
        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-pure), var(--gold-bright));
            box-shadow: 0 0 12px var(--gold-pure);
            transition: width 0.2s ease;
        }

        .container {
            max-width: 920px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Tarjeta Principal del Contrato */
        .contract-wrapper {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 50px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(212, 175, 55, 0.04);
            position: relative;
        }

        /* Sello de Seguridad Superior */
        .badge-security {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-pure);
            color: var(--gold-bright);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.85rem;
            line-height: 1.3;
            background: linear-gradient(135deg, #FFF3B8 0%, var(--gold-pure) 50%, #B8860B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        /* Bloque de Partes */
        .parties-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }

        .party-box {
            background: rgba(6, 10, 18, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 10px;
            padding: 20px;
        }

        .party-box h3 {
            color: var(--gold-bright);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .party-box p {
            font-size: 0.88rem;
            color: var(--text-ivory);
        }

        .gold-highlight {
            color: var(--gold-bright);
            font-weight: 600;
        }

        /* Acordeones Dinámicos para las Cláusulas */
        .clause-card {
            background: var(--bg-clause);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-left: 4px solid var(--gold-pure);
            border-radius: 10px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .clause-card:hover {
            border-color: var(--gold-bright);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.08);
        }

        .clause-header {
            padding: 18px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(212, 175, 55, 0.03);
        }

        .clause-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-bright);
            font-size: 1.02rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .clause-icon {
            color: var(--gold-pure);
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .clause-card.active .clause-icon {
            transform: rotate(45deg);
        }

        .clause-body {
            padding: 0 24px 22px 24px;
            font-size: 0.94rem;
            color: var(--text-ivory);
            display: block;
        }

        .clause-card.collapsed .clause-body {
            display: none;
        }

        .clause-body ul {
            margin-top: 12px;
            padding-left: 20px;
        }

        .clause-body li {
            margin-bottom: 10px;
        }

        .clause-body li::marker {
            color: var(--gold-pure);
        }

        /* Panel de Firma Digital Interactiva */
        .signature-panel {
            margin-top: 40px;
            background: linear-gradient(145deg, #090F1D, #111C33);
            border: 1px solid var(--gold-pure);
            border-radius: 12px;
            padding: 30px;
        }

        .signature-panel h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold-bright);
            font-size: 1.2rem;
            margin-bottom: 18px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .custom-check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-ivory);
        }

        .custom-check input {
            accent-color: var(--gold-pure);
            width: 19px;
            height: 19px;
            margin-top: 3px;
            cursor: pointer;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 22px;
        }

        .input-field {
            background: rgba(6, 10, 18, 0.85);
            border: 1px solid var(--border-gold);
            color: var(--gold-bright);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.92rem;
            width: 100%;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--gold-bright);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
        }

        .btn-gold {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-pure) 50%, var(--gold-bright) 100%);
            color: #060A12;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(247, 217, 105, 0.45);
        }

        .btn-gold:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .audit-receipt {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px dashed var(--gold-bright);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--gold-bright);
        }

        @media (max-width: 768px) {
            .contract-wrapper { padding: 25px; }
            .parties-grid, .input-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="container">
        <div class="contract-wrapper">
            <div class="badge-security">🛡️ Protocolo AML / KYC • ISO 27001 • Trazabilidad Total</div>
            <h1>ACUERDO MARCO DE CUMPLIMIENTO NORMATIVO, SEGURIDAD Y PREVENCIÓN DE LAVADO DE ACTIVOS</h1>
            <p class="subtitle">Instrumento jurídico vinculante de gobernanza tecnológica, auditoría estatal y responsabilidad operativa internacional.</p>

            <!-- Partes Intervinientes -->
            <div class="parties-grid">
                <div class="party-box">
                    <h3>🏛️ El Proveedor / La Plataforma</h3>
